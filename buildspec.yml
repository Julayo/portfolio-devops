version: 0.2

phases:
  build:
    commands:
      - "echo == Build phase =="
      - "echo Bucket: ${TARGET_BUCKET}"
      - "pwd"
      - "ls -la"

      # entry pages must never be served stale after a deploy
      - >
        aws s3 cp index.html s3://${TARGET_BUCKET}/index.html
        --cache-control "no-cache, must-revalidate"

      - >
        aws s3 cp tutorials.html s3://${TARGET_BUCKET}/tutorials.html
        --cache-control "no-cache, must-revalidate"

      # Everything else: 1-day cache (no content hashing, so keep it short)
      - >
        aws s3 sync . s3://${TARGET_BUCKET} --delete
        --exclude '.git/*'
        --exclude '.gitignore'
        --exclude 'buildspec.yml'
        --exclude 'README.md'
        --exclude 'generate-og-image.html'
        --exclude 'resume.html'
        --exclude 'infra/*'
        --exclude 'index.html'
        --exclude 'tutorials.html'
        --cache-control "max-age=86400"

      # Clean ("pretty") URLs: the bucket is private + served via OAC, so S3
      # can't auto-resolve /tutorials -> tutorials.html. Publish an extra
      # extensionless copy with an explicit text/html type. Must run AFTER the
      # `sync --delete` above, or the sync would prune it.
      - >
        aws s3 cp tutorials.html s3://${TARGET_BUCKET}/tutorials
        --content-type "text/html"
        --cache-control "no-cache, must-revalidate"

  post_build:
    commands:
      - "echo == CloudFront invalidation =="
      # Target only the files that change on each deploy instead of /* (cheaper + faster)
      - >
        aws cloudfront create-invalidation
        --distribution-id ${CLOUDFRONT_DIST_ID}
        --paths "/index.html" "/tutorials.html" "/tutorials" "/404.html" "/styles.css" "/favicon.svg" "/resume.pdf"
